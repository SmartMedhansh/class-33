<html>
<head>
    <title>Navbar</title>

    <style>
    body{
        background-color: lightblue;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif
    }

    .topnav{
        overflow: hidden;
        background-color: plum;
    }

    .topnav a {
             float: left;
             color: lavender;
             text-align: center;
             padding: 14px 16px;
             text-decoration: wavy;
             font-size: 20px;        
    }

    .topnav a:hover{
     background-color: darkmagenta;
     color: aliceblue;
    }

    .topnav a:active{
        background-color: aquamarine;
        color: beige;
    }



    </style>

</head>
<body>
<div class="topnav">
<a class="active" herf="#home">Home</a>
<a herf="#">About_Our_Community</a>
<a herf="Gallery">Gallery</a>
<a herf="#">Help_Line</a>
</div>

</body>

</html>
